<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>

<body>
    <button id="clicked">get Students</button>
    <ol id="hi"></ol>
    <script>
        $("#clicked").click(() => {
            $("#hi").empty();
            $.get("https://6a68bfa9b2789286ad702751.mockapi.io/Students",(data,status)=>{for(i=0;i<data.length;i++){
                $("#hi").append("<li> "+data[i].name+" </li>")
            }})
        });
    </script>
</body>

</html>
