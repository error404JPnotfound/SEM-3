<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>
<body>
    <ul>
        <li>hi</li>
        <li>hello</li>
    </ul>
    <input type="text" id="input-text">
    <button id="append">Click to append</button><br>
    <button id="before">Click to before</button><br>
    <button id="remove">Click to remove</button><br>
    <button id="ccss">Click to add css</button><br>
    <span></span>
    <script>
        $("#append").click(function(){
            $("ul").append("<li> "+$("#input-text").val()+" </li>");
        })
        $("#before").click(function(){
            $("ul").before("<li> "+$("#input-text").val()+" </li>");
        })
        $("#ccss").click(function(){
            $("ul").css("background-color","red");
        })
        $("#remove").click(function(){
            $("ul").remove();
        })
    </script>
</body>
</html>
