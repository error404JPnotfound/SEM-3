<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <style>
        body{
            background-color: aqua;
        }
    </style>
</head>

<body>
    <!-- write a jQUery program to get content of textbox and set to paragraph with "data" class -->
    <input type="text" id="upado">
    <button style="color: aquamarine;" id="muko">MUKO</button>
    <p style="color:red;" class="data"></p>
    <script>
        $("#muko").click(function (){
            let val = $("#upado").val();
            $(".data").text(val);
        });
    </script>
</body>

</html>
