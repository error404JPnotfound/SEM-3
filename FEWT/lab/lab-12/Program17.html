<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>

<body>
    <input id="enroll" type="text">
    <script>
        $("#enroll").blur(function () {
            let inputenroll = $("#enroll").val();
            var pattern = /^[0-9]{11}$/;
            if (pattern.test(inputenroll)) {
                alert("valid");
            } else {
                alert("invalid");
            }
        })
    </script>
</body>

</html>
