<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>

<body>
    <!-- write a jQuery program to append new list item with "Hello World" to existing unordered list
    when clicked on button -->
    <ul>
        <li>hello</li>
        <li>hi</li>
    </ul>
    <button id="clickkaro">click karo bhai</button>
    <script>
        $("#clickkaro").click(function(){
            $("ul").append("<li>Hola</li>");
        });
    </script>
</body>

</html>
